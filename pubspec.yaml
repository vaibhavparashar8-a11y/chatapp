name: chatapp
description: Private 2-person chat app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # Calls — Agora (hosted, per-minute) and peer-to-peer WebRTC (free).
  # Which one runs is chosen at runtime by the `call_backend` Remote Config key.
  agora_rtc_engine: ^6.3.0
  # Must be 1.x: every 0.11.x still ships Flutter's removed v1-embedding
  # `PluginRegistry.Registrar`, which fails to compile on Flutter 3.44+.
  flutter_webrtc: ^1.6.2

  # Media picking
  # In-app camera — the WhatsApp-style capture screen (screens/camera_screen.dart)
  camera: ^0.12.1
  # Reads the device gallery for the camera screen's recent-media strip
  photo_manager: ^3.6.0
  image_picker: ^1.0.7
  file_picker: ^12.0.0

  # UI helpers
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.8.2
  chewie: ^1.7.4
  intl: ^0.19.0
  permission_handler: ^11.3.0
  path: ^1.9.0
  uuid: ^4.3.3
  open_filex: ^4.5.0
  dio: ^5.4.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  firebase_remote_config: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^5.1.0
  timezone: ^0.9.4
  device_info_plus: ^13.2.0
  call_log: ^6.0.1
  video_compress: ^3.1.2
  workmanager: ^0.10.10
  url_launcher: ^6.2.5

# wakelock_plus comes in transitively (chewie). Pub settles on 1.7.0, whose
# Android sources import the Pigeon message classes from the root package —
# invalid under Kotlin 2.x, so `:wakelock_plus:compileReleaseKotlin` fails.
# 1.8.0 fixes that and is also the first Built-in-Kotlin build.gradle.
dependency_overrides:
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  # A gradient PNG, not a flat colour: the background used to be dark green
  # (#1B5E20) behind a blue foreground, so every adaptive launcher drew a blue
  # circle on a green square.
  adaptive_icon_background: "assets/icon_background.png"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
